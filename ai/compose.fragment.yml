services:
  ai-network:
    build:
      context: .
      dockerfile: ai/Dockerfile
    image: ahr-idps/ai-network:phase6
    pull_policy: build
    init: true
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -m
      - ai.network.infer
    user: "65532:65532"
    networks:
      - data
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${AHR_DB_USER:?Set AHR_DB_USER in .env}
      POSTGRES_PASSWORD: ${AHR_DB_PASSWORD:?Set AHR_DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      NORMALIZED_STREAM: security.events.normalized
      PREDICTIONS_STREAM: security.predictions
      NETWORK_AI_GROUP: ai-network
      NETWORK_AI_CONSUMER: ai-network-1
      NETWORK_MODEL_PATH: /opt/ahr-idps/experiments/models/network-xgboost.json
      NETWORK_AI_HEARTBEAT: /tmp/network-ai-heartbeat.json
    volumes:
      - ./experiments/models:/opt/ahr-idps/experiments/models
      - ./datasets:/opt/ahr-idps/datasets
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=67108864
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /tmp/network-ai-heartbeat.json
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 192
    labels:
      com.ahr-idps.component: network-ai
      com.ahr-idps.phase: "6"

