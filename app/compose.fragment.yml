x-backend-service: &backend-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: ahr-idps/backend:phase4
  pull_policy: build
  init: true
  restart: "no"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  nginx:
    depends_on:
      dvwa:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true
    volumes:
      - ./infrastructure/nginx/nginx.phase4.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/ahr-idps
    networks:
      - ingress
      - dvwa_front
      - app_front

  backend:
    <<: *backend-service
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    user: "65532:65532"
    expose:
      - "8000"
    networks:
      - data
      - app_front
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${AHR_DB_USER:?Set AHR_DB_USER in .env}
      POSTGRES_PASSWORD: ${AHR_DB_PASSWORD:?Set AHR_DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      NORMALIZED_STREAM: security.events.normalized
      DASHBOARD_DIST: /opt/ahr-idps/dashboard/dist
      EXPERIMENTS_DIR: /opt/ahr-idps/experiments
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      normalizer:
        condition: service_healthy
        restart: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=67108864
    volumes:
      - ./datasets:/opt/ahr-idps/datasets
      - ./experiments:/opt/ahr-idps/experiments
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3));
          raise SystemExit(0 if data.get('status') == 'healthy' else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 160
    labels:
      com.ahr-idps.component: backend-api
      com.ahr-idps.phase: "4"

networks:
  app_front:
    driver: bridge
    internal: true
    labels:
      com.ahr-idps.zone: app-front
